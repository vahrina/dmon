</tbody>
</table>

<script data-cfasync="false" type="text/javascript" src="/assets/js/logo-fire.js"></script>
<script data-cfasync="false" src="https://unpkg.com/xregexp/xregexp-all.js"></script>
<script data-cfasync="false" type="text/javascript" src="/assets/js/search.js"></script>
<script data-cfasync="false" type="text/javascript" src="/assets/js/shortcuts.js"></script>
<script data-cfasync="false">
(function () {
  const tbody = document.querySelector('#list tbody');
  if (!tbody) return;

  // point both /data & /data/ to the api root
  const dataRel = location.pathname.replace(/^\/data(?:\/|$)/, '');
  const listUrl = '/api/list/' + dataRel;

    fetch(listUrl)
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(entries => {
      const atDataRoot = dataRel === '';
      entries
        .filter(e => e.name !== 'index.html')
        .sort((a, b) => {
          if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
          return a.name.localeCompare(b.name);
        })
        .forEach(e => {
          const isDir = e.type === 'directory';
          const name  = isDir ? e.name + '/' : e.name;
          const size  = isDir ? '…' : fmtSize(e.size);
          const date  = fmtDate(e.mtime);

          const tr = document.createElement('tr');
          tr.innerHTML =
            `<td class="link"><a href="${encodeURI(name)}">${name}</a></td>` +
            `<td class="size">${size}</td>` +
            `<td class="date">${date}</td>`;
          tbody.appendChild(tr);

          if (isDir) {
            const sizeCell = tr.querySelector('td.size');
            const rel = dataRel + e.name + '/';
            if (atDataRoot) {
              dirTotalBytes(rel).then(total => {
                sizeCell.textContent = total ? fmtSize(total) : '-';
              }).catch(() => { sizeCell.textContent = '-'; });
            } else {
              fetch('/api/list/' + rel)
                .then(r => r.ok ? r.json() : [])
                .then(files => {
                  const total = files
                    .filter(f => f.type !== 'directory')
                    .reduce((sum, f) => sum + (f.size || 0), 0);
                  sizeCell.textContent = total ? fmtSize(total) : '-';
                })
                .catch(() => { sizeCell.textContent = '-'; });
            }
          }
        });
    })
    .catch(() => {});

    function dirTotalBytes(relPath) {
      return fetch('/api/list/' + relPath)
        .then(r => { if (!r.ok) throw 0; return r.json(); })
        .then(entries => {
          let filesSum = 0;
          const subdirs = [];
          for (const e of entries) {
            if (e.name === 'index.html') continue;
            if (e.type === 'directory') subdirs.push(relPath + e.name + '/');
            else filesSum += e.size || 0;
          }
          return Promise.all(subdirs.map(dirTotalBytes)).then(parts => filesSum + parts.reduce((a, b) => a + b, 0));
        });
    }

    function fmtSize(b) {
      if (!b) return '-';
      const u = ['b','k','m','g','t'];
      let i = 0;
      while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
      return (i === 0 ? b : b.toFixed(1)) + u[i];
    }

    function fmtDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d)) return '-';
      const mon = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      return `${String(d.getDate()).padStart(2,'0')}-${mon[d.getMonth()]}-${d.getFullYear()}`;
    }
})();
</script>
